<style>
  :root { --bg: #000000; --fg: #ffffff; --accent: #05E5AF; --acr: 5,229,175; color-scheme: dark; }

    background: linear-gradient(90deg, #000 0px, #000 var(--X, 0px), rgba(0,0,0,0) calc(var(--X, 0px) + 190px), rgba(0,0,0,0) calc(var(--X, 0px) + 1276px), #000 calc(var(--X, 0px) + 1466px), #000 100%); }

    pointer-events: none; z-index: 2; background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.45) 45%, rgba(0,0,0,.85) 78%, #000 100%); }

  .pcont { position: absolute; left: var(--X, 0px); top: calc(var(--E, 0px) / 2); width: 1466px; transition: translate .55s cubic-bezier(.3, .9, .3, 1), scale .55s cubic-bezier(.3, .9, .3, 1); }
