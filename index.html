    const l = current && current.layer;
    if (l) { l.style.transition = ''; l.style.opacity = ''; const c = chromeOf(l); if (c) { c.style.transition = ''; bodyOf(l).forEach(b => { b.style.transition = ''; b.style.opacity = ''; }); } }
    if (Math.abs(x) > 110 && swipeTo(x < 0 ? 1 : -1, x)) { haptic('strong'); return; }
    snapBack();
  }
  let sw = null;
  viewport.addEventListener('pointerdown', e => {
    // a tap no longer brings the hidden header back; only scrolling does (see each board's onScroll)
    if (busy || overlay || !current || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (e.target.closest && e.target.closest(NOSWIPE)) return;
    sw = { x: e.clientX, y: e.clientY, t: performance.now(), on: null, d: 0, id: e.pointerId };
  }, true);
  viewport.addEventListener('pointermove', e => {
    if (!sw || e.pointerId !== sw.id) return;
    const dx = (e.clientX - sw.x) / scale, dy = (e.clientY - sw.y) / scale;
    if (sw.on === null && (Math.abs(dx) > 14 || Math.abs(dy) > 14)) sw.on = Math.abs(dx) > Math.abs(dy) * 1.4;
    if (sw.on) { sw.d = shiftLive(dx); if (current) current.layer._dragged = true; }
  }, true);
  const endSwipe = e => {
    if (!sw || (e && e.pointerId !== sw.id)) return;
    const s = sw; sw = null;
    if (s.on) {
      const v = s.d / Math.max(1, performance.now() - s.t);
      commitOrSnap(Math.abs(v) > 0.9 && Math.abs(s.d) > 50 ? Math.sign(s.d) * 200 : s.d);
      const l = current && current.layer; setTimeout(() => { if (l) l._dragged = false; }, 60);
    }
  };
  viewport.addEventListener('pointerup', endSwipe, true);
  viewport.addEventListener('pointercancel', () => { if (sw && sw.on) snapBack(); sw = null; }, true);
  // two-finger trackpad swipe
  let wAcc = 0, wT = 0, wCool = 0;
  viewport.addEventListener('wheel', e => {
    if (busy || overlay || !current || performance.now() < wCool) return;
    if (Math.abs(e.deltaX) < Math.abs(e.deltaY) * 1.5 || (e.target.closest && e.target.closest(NOSWIPE))) return;
    wAcc -= e.deltaX; const x = shiftLive(wAcc * 0.7);
    clearTimeout(wT);
    if (Math.abs(wAcc) > 170) { wCool = performance.now() + 1100; const a = wAcc; wAcc = 0; current.layer.style.opacity = ''; if (!swipeTo(a < 0 ? 1 : -1, x)) snapBack(); return; }
    wT = setTimeout(() => { wAcc = 0; snapBack(); }, 160);
  }, { passive: true, capture: true });
  addEventListener('keydown', e => { if (overlay || busy || (e.target && /INPUT|TEXTAREA/.test(e.target.tagName))) return; if (e.key === 'ArrowRight') swipeTo(1); else if (e.key === 'ArrowLeft') swipeTo(-1); });

  addEventListener('keydown', e => { if (e.key === 'Escape') { if (overlay) closeOverlay(); else back(); } });
  addEventListener('resize', fit);
  addEventListener('orientationchange', () => setTimeout(fit, 250));
  addEventListener('pageshow', () => setTimeout(fit, 50));
  addEventListener('hashchange', () => {
    if (!P) return;
    const h = decodeURIComponent(location.hash.slice(1));
    const aid = Object.keys(P.artboards).find(k => slug(P.artboards[k].name) === h);
    if (aid && aid !== currentAid()) go(aid, 'dissolve', 0.3, 'ease-out');
  });

  fetch('proto.json').then(r => r.json()).then(async d => {
    P = d;
    Object.values(P.boards).forEach(b => (b.videos || []).forEach(v => { if (v.trim) trims[v.id] = v.trim; }));
    fit();
    const home = Object.keys(P.artboards).find(k => P.artboards[k].name === 'Recruiting Home');
    const h = decodeURIComponent(location.hash.slice(1));
    const start = Object.keys(P.artboards).find(k => slug(P.artboards[k].name) === h) || home;
    try { await document.fonts.load("400 16px 'Vivint Sans'"); } catch (e) {}
    await go(start, 'none', 0);
    document.getElementById('loading').classList.add('done');
  });
})();
</script>
